[package]
name = "geffeniuse"
version = "0.17.5"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
geffeniuse-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "macros", "sync", "process", "time", "io-util", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
anyhow = "1"
