[package]
name = "geffeniuse-core"
version = "0.17.5"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "macros", "sync", "process", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
dirs = "5"
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "v3"] }
